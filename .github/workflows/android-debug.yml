name: Android Debug APK

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build RYKO debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out develop
        uses: actions/checkout@v5

      - name: Materialize header PNG
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode assets/ui/header_composite_2d.png.b64.full > assets/ui/header_composite_2d.png
          test -s assets/ui/header_composite_2d.png
          magic="$(od -An -tx1 -N8 assets/ui/header_composite_2d.png | tr -d ' \n')"
          if [ "$magic" != "89504e470d0a1a0a" ]; then
            echo "Header asset is not a valid PNG. Magic: $magic"
            exit 1
          fi
          echo "Header PNG materialized successfully: $(wc -c < assets/ui/header_composite_2d.png) bytes"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages and debug key
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=RYKO,C=RO" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Validate Godot project scripts
        shell: bash
        run: |
          set -euo pipefail
          godot_zip="$RUNNER_TEMP/godot-4.4.1.zip"
          godot_dir="$RUNNER_TEMP/godot-4.4.1"
          validation_log="$RUNNER_TEMP/godot-validation.log"

          curl -L --fail --silent --show-error \
            -o "$godot_zip" \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          mkdir -p "$godot_dir"
          unzip -q "$godot_zip" -d "$godot_dir"

          XDG_DATA_HOME="$RUNNER_TEMP/godot-data" \
          XDG_CONFIG_HOME="$RUNNER_TEMP/godot-config" \
          XDG_CACHE_HOME="$RUNNER_TEMP/godot-cache" \
            "$godot_dir/Godot_v4.4.1-stable_linux.x86_64" \
            --headless --path . --editor --quit 2>&1 | tee "$validation_log"

          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Could not preload resource" "$validation_log"; then
            echo "Godot script/resource validation failed."
            exit 1
          fi

      - name: Export Android debug APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          cache: true
          verbose: true

      - name: Upload phone build
        uses: actions/upload-artifact@v4
        with:
          name: ryko-android-debug
          path: build/**/ryko-debug.apk
          if-no-files-found: error
          retention-days: 14
