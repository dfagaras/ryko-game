name: Android Debug APK

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build RYKO debug APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4

    steps:
      - name: Check out develop
        uses: actions/checkout@v5

      - name: Install export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          template_dir="$(find /root/.local/share/godot/export_templates -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$template_dir" ]; then
            echo "Godot export templates were not found in the build image."
            exit 1
          fi
          template_name="$(basename "$template_dir")"
          if [ "$template_dir" != "$HOME/.local/share/godot/export_templates/$template_name" ]; then
            cp -R "$template_dir" "$HOME/.local/share/godot/export_templates/$template_name"
          fi

      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          yes | sdkmanager --sdk_root=/usr/lib/android-sdk --licenses >/dev/null || true
          sdkmanager --sdk_root=/usr/lib/android-sdk \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"
          java_home_path="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"'
            echo "export/android/java_sdk_path = \"$java_home_path\""
          } > "$HOME/.config/godot/editor_settings-4.tres"
          keytool -genkeypair             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -dname "CN=Android Debug,O=RYKO,C=RO"             -keyalg RSA             -keysize 2048             -validity 10000

      - name: Import project
        run: godot --headless --editor --quit

      - name: Build debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/ryko-debug.apk

      - name: Upload phone build
        uses: actions/upload-artifact@v4
        with:
          name: ryko-android-debug
          path: build/ryko-debug.apk
          if-no-files-found: error
          retention-days: 14
