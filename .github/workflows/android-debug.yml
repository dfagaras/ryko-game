name: Android Debug APK

on:
  push:
    branches:
      - develop
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build RYKO debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source branch
        uses: actions/checkout@v5

      - name: Validate level editor model
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/level-editor/model.js
          node --check tools/level-editor/ball-range-extension.js
          node --check tools/level-editor/editor.js
          node --check tools/level-editor/scale-controls.js
          node --check tools/level-editor/ball-range-ui.js
          node tools/level-editor/validate-editor.mjs

      - name: Verify final header assets
        shell: bash
        run: |
          set -euo pipefail

          board="assets/ui/finalboard.png"
          font="assets/fonts/Oxanium-VariableFont_wght.ttf"

          test -s "$board"
          png_magic="$(od -An -tx1 -N8 "$board" | tr -d ' \n')"
          if [ "$png_magic" != "89504e470d0a1a0a" ]; then
            echo "$board is not a valid PNG. Magic: $png_magic"
            exit 1
          fi

          test -s "$font"
          font_magic="$(od -An -tx1 -N4 "$font" | tr -d ' \n')"
          case "$font_magic" in
            00010000|4f54544f|74746366) ;;
            *)
              echo "$font does not look like a valid OpenType/TrueType font. Magic: $font_magic"
              exit 1
              ;;
          esac

          echo "Verified finalboard.png ($(wc -c < "$board") bytes)"
          echo "Verified Oxanium font ($(wc -c < "$font") bytes)"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages and debug key
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=RYKO,C=RO" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Validate Godot project scripts and board scale contract
        shell: bash
        run: |
          set -euo pipefail
          godot_zip="$RUNNER_TEMP/godot-4.4.1.zip"
          godot_dir="$RUNNER_TEMP/godot-4.4.1"
          validation_log="$RUNNER_TEMP/godot-validation.log"

          curl -L --fail --silent --show-error \
            -o "$godot_zip" \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          mkdir -p "$godot_dir"
          unzip -q "$godot_zip" -d "$godot_dir"
          godot="$godot_dir/Godot_v4.4.1-stable_linux.x86_64"

          XDG_DATA_HOME="$RUNNER_TEMP/godot-data" \
          XDG_CONFIG_HOME="$RUNNER_TEMP/godot-config" \
          XDG_CACHE_HOME="$RUNNER_TEMP/godot-cache" \
            "$godot" --headless --path . --editor --quit 2>&1 | tee "$validation_log"

          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Could not preload resource|Error loading resource|Failed loading resource|Error importing" "$validation_log"; then
            echo "Godot script/resource validation failed."
            exit 1
          fi

          XDG_DATA_HOME="$RUNNER_TEMP/godot-data" \
          XDG_CONFIG_HOME="$RUNNER_TEMP/godot-config" \
          XDG_CACHE_HOME="$RUNNER_TEMP/godot-cache" \
            "$godot" --headless --path . --script tools/validate_board_scale.gd

      - name: Export Android debug APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          cache: true
          verbose: true

      - name: Upload phone build
        uses: actions/upload-artifact@v4
        with:
          name: ryko-android-debug
          path: build/**/ryko-debug.apk
          if-no-files-found: error
          retention-days: 14
