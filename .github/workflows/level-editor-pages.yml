name: RYKO Level Editor Pages

on:
  push:
    branches:
      - develop
    paths:
      - "tools/level-editor/**"
      - "assets/icons/**"
      - "assets/ui/mission_block/**"
      - ".github/workflows/level-editor-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ryko-level-editor-pages"
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v6

      - name: Validate editor JavaScript and JSON model
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/level-editor/model.js
          node --check tools/level-editor/mechanics-model.js
          node --check tools/level-editor/ball-range-extension.js
          node --check tools/level-editor/block-color-model.js
          node --check tools/level-editor/mission-block-model.js
          node --check tools/level-editor/editor.js
          node --check tools/level-editor/scale-controls.js
          node --check tools/level-editor/ball-range-ui.js
          node --check tools/level-editor/editor-extras.js
          node --check tools/level-editor/mission-block-ui.js
          node --check tools/level-editor/mechanics-ui.js
          node --check tools/level-editor/editor-interaction-fixes.js
          node tools/level-editor/validate-editor.mjs
          node tools/level-editor/validate-ball-range.mjs
          node tools/level-editor/validate-top-row-bounds.mjs
          node tools/level-editor/validate-mission-core.mjs
          node tools/level-editor/validate-mechanics.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/ryko-level-editor-site"
          mkdir -p "$site/assets/icons" "$site/assets/ui/mission_block"
          cp tools/level-editor/index.html "$site/index.html"
          cp tools/level-editor/styles.css "$site/styles.css"
          cp tools/level-editor/model.js "$site/model.js"
          cp tools/level-editor/mechanics-model.js "$site/mechanics-model.js"
          cp tools/level-editor/ball-range-extension.js "$site/ball-range-extension.js"
          cp tools/level-editor/block-color-model.js "$site/block-color-model.js"
          cp tools/level-editor/mission-block-model.js "$site/mission-block-model.js"
          cp tools/level-editor/editor.js "$site/editor.js"
          cp tools/level-editor/scale-controls.js "$site/scale-controls.js"
          cp tools/level-editor/ball-range-ui.js "$site/ball-range-ui.js"
          cp tools/level-editor/editor-extras.js "$site/editor-extras.js"
          cp tools/level-editor/mission-block-ui.js "$site/mission-block-ui.js"
          cp tools/level-editor/mechanics-ui.js "$site/mechanics-ui.js"
          cp tools/level-editor/editor-interaction-fixes.js "$site/editor-interaction-fixes.js"
          touch "$site/.nojekyll"
          cp assets/icons/block_black_hole.png "$site/assets/icons/"
          cp assets/icons/block_dense.png "$site/assets/icons/"
          cp assets/icons/block_phase.png "$site/assets/icons/"
          cp assets/icons/block_regenerative.png "$site/assets/icons/"
          cp assets/icons/power_ghost.png "$site/assets/icons/"
          cp assets/icons/power_ion.png "$site/assets/icons/"
          cp assets/icons/power_plus_one.png "$site/assets/icons/"
          cp assets/icons/power_supernova.png "$site/assets/icons/"
          cp "assets/ui/mission_block/rama (3).png" "$site/assets/ui/mission_block/"
          test -s "$site/mission-block-model.js"
          test -s "$site/mission-block-ui.js"
          test -s "$site/mechanics-model.js"
          test -s "$site/mechanics-ui.js"
          test -s "$site/editor-interaction-fixes.js"
          test -s "$site/assets/ui/mission_block/rama (3).png"
          grep -q 'mission-block-model.js' "$site/index.html"
          grep -q 'mission-block-ui.js' "$site/index.html"
          grep -q 'mechanics-model.js' "$site/index.html"
          grep -q 'mechanics-ui.js' "$site/index.html"
          grep -q 'editor-interaction-fixes.js' "$site/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/ryko-level-editor-site

  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
